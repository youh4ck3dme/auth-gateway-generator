<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A1814" />
  <title>Auth Gateway Generator</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root { --bg:#1A1814; --card:#0F0E0C; --line:rgba(200,161,110,.18); --bronze:#C8A16E; --ink:#F3EEE4; --muted:#9A9286; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, sans-serif; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 14px 28px; }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    h1 { font-size: 18px; }
    p.sub { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 9px 12px; font-size: 13px; font-weight: 600; }
    .primary { background: #C8A16E; color: #1A1814; border-color: transparent; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 12px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
    input[type=text], select { width: 100%; background: #161411; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: 13px "IBM Plex Mono", monospace; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; }
    .seg button.on { border-color: var(--bronze); color: var(--bronze); }
    .check { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; background: #161411; font-size: 13px; }
    .modebar { display: flex; gap: 6px; margin-bottom: 8px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .tab { font: 11px "IBM Plex Mono", monospace; border-radius: 999px; color: var(--muted); }
    .tab.on { color: #E2C38A; border-color: var(--bronze); }
    .editor { display: grid; grid-template-columns: 42px 1fr; background: #0A0908; border: 1px solid var(--line); border-radius: 12px; min-height: 280px; max-height: 46vh; overflow: auto; }
    .gutter { padding: 12px 6px; text-align: right; color: #6d655b; font: 12px/1.55 "IBM Plex Mono", monospace; user-select: none; }
    pre { padding: 12px 12px 12px 0; font: 12px/1.55 "IBM Plex Mono", monospace; white-space: pre; color: #E8DFD0; }
    iframe.preview { width: 100%; height: 46vh; min-height: 320px; border: 1px solid var(--line); border-radius: 12px; background: #111; }
    .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #221e18; border: 1px solid var(--bronze); color: #E2C38A; padding: 8px 12px; border-radius: 999px; display: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Auth Gateway Generator</h1>
        <p class="sub">Next.js alebo HTML/PHP. Editor + live preview login obrazovky.</p>
      </div>
      <div class="actions">
        <button id="copyBtn" type="button">Kopírovať súbor</button>
        <button id="zipBtn" class="primary" type="button">Stiahnuť ZIP</button>
      </div>
    </header>
    <div class="grid">
      <aside class="panel">
        <label>Stack</label>
        <div class="seg">
          <button type="button" id="stackNext" class="on">Next.js</button>
          <button type="button" id="stackPhp">HTML + PHP</button>
        </div>
        <label>Názov projektu</label>
        <input id="projectName" type="text" value="my-app" />
        <label>Databáza</label>
        <select id="db">
          <option value="postgresql">PostgreSQL</option>
          <option value="sqlite">SQLite</option>
          <option value="mysql">MySQL (PHP)</option>
        </select>
        <label>Providery</label>
        <label class="check"><input id="pEmail" type="checkbox" checked /> Email + heslo</label>
        <label class="check"><input id="pGoogle" type="checkbox" checked /> Google</label>
        <label class="check"><input id="pGithub" type="checkbox" checked /> GitHub</label>
        <button id="genBtn" class="primary" type="button" style="width:100%;margin-top:14px">Generuj bránu</button>
      </aside>
      <section class="panel">
        <div class="modebar">
          <button type="button" id="modeCode" class="on">Editor</button>
          <button type="button" id="modePreview">Preview</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div id="codeWrap" class="editor"><div class="gutter" id="gutter"></div><pre id="code"></pre></div>
        <iframe id="preview" class="preview" hidden title="Login preview"></iframe>
      </section>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { stack: "next", files: [], active: 0, mode: "code" };

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => (el.style.display = "none"), 1600);
    }
    function cfg() {
      return {
        name: $("projectName").value.trim() || "my-app",
        db: $("db").value,
        email: $("pEmail").checked,
        google: $("pGoogle").checked,
        github: $("pGithub").checked,
      };
    }

    function loginPreviewHtml(c) {
      const social = [
        c.google ? `<button class="btn">Pokračovať cez Google</button>` : "",
        c.github ? `<button class="btn">Pokračovať cez GitHub</button>` : "",
      ].join("");
      const form = c.email ? `<form class="stack"><label>Email<input type="email" placeholder="you@firma.sk"></label><label>Heslo<input type="password" placeholder="••••••••"></label><button class="btn primary">Prihlásiť sa</button></form>` : "";
      return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1A1814;color:#F3EEE4;font-family:Instrument Sans,system-ui,sans-serif}
        .card{width:min(380px,92vw);background:#0F0E0C;border:1px solid rgba(200,161,110,.22);border-radius:18px;padding:28px}
        h1{margin:0 0 6px;font-size:22px} p{margin:0 0 16px;color:#9A9286;font-size:14px}
        .stack{display:grid;gap:10px} label{display:grid;gap:6px;font-size:12px;color:#9A9286}
        input,button{font:inherit} input{padding:10px 12px;border-radius:10px;border:1px solid rgba(200,161,110,.25);background:#161411;color:#F3EEE4}
        .btn{width:100%;padding:11px;border-radius:12px;border:1px solid rgba(200,161,110,.3);background:#161411;color:#F3EEE4;font-weight:600}
        .primary{background:#C8A16E;color:#1A1814;border-color:transparent}
        .hr{text-align:center;color:#9A9286;font-size:12px;margin:12px 0}
      </style></head><body><div class="card"><h1>${c.name}</h1><p>${state.stack === "php" ? "PHP session brána" : "Better Auth brána"}</p><div class="stack">${social}</div>${form ? `<div class="hr">alebo email</div>${form}` : ""}</div></body></html>`;
    }

    function nextFiles(c) {
      const provider = c.db === "sqlite" ? "sqlite" : "postgresql";
      const social = [];
      if (c.google) social.push(`    google: { clientId: process.env.GOOGLE_CLIENT_ID!, clientSecret: process.env.GOOGLE_CLIENT_SECRET! }`);
      if (c.github) social.push(`    github: { clientId: process.env.GITHUB_CLIENT_ID!, clientSecret: process.env.GITHUB_CLIENT_SECRET! }`);
      const auth = `import { betterAuth } from "better-auth";
import { prismaAdapter } from "better-auth/adapters/prisma";
import { nextCookies } from "better-auth/next-js";
import { prisma } from "@/lib/prisma";

export const auth = betterAuth({
  database: prismaAdapter(prisma, { provider: "${provider}" }),
  emailAndPassword: { enabled: ${c.email}, requireEmailVerification: false },
  ${social.length ? `socialProviders: {\n${social.join(",\n")},\n  },` : ""}
  plugins: [nextCookies()],
});
`;
      return [
        { path: "lib/auth.ts", content: auth, lang: "ts" },
        { path: "app/api/auth/[...all]/route.ts", content: `import { auth } from "@/lib/auth";\nimport { toNextJsHandler } from "better-auth/next-js";\n\nexport const { GET, POST } = toNextJsHandler(auth);\n`, lang: "ts" },
        { path: "lib/auth-client.ts", content: `import { createAuthClient } from "better-auth/react";\nexport const authClient = createAuthClient();\nexport const { signIn, signUp, signOut, useSession } = authClient;\n`, lang: "ts" },
        { path: "preview/login.html", content: loginPreviewHtml(c), lang: "html", preview: true },
      ];
    }

    function phpFiles(c) {
      const driver = c.db === "sqlite" ? "sqlite" : "mysql";
      const config = `<?php
declare(strict_types=1);

return [
  'db' => [
    'driver' => '${driver}',
    'dsn' => getenv('DATABASE_URL') ?: '${driver === "sqlite" ? "sqlite:" . c.name + ".sqlite" : "mysql:host=127.0.0.1;dbname=" + c.name + ";charset=utf8mb4"}',
    'user' => getenv('DB_USER') ?: 'root',
    'pass' => getenv('DB_PASS') ?: '',
  ],
  'google' => ['id' => getenv('GOOGLE_CLIENT_ID') ?: '', 'secret' => getenv('GOOGLE_CLIENT_SECRET') ?: ''],
  'github' => ['id' => getenv('GITHUB_CLIENT_ID') ?: '', 'secret' => getenv('GITHUB_CLIENT_SECRET') ?: ''],
];
`;
      const auth = `<?php
declare(strict_types=1);

function db(): PDO {
  static $pdo;
  if ($pdo) return $pdo;
  $c = require __DIR__ . '/config.php';
  $pdo = new PDO($c['db']['dsn'], $c['db']['user'], $c['db']['pass'], [
    PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
    PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
  ]);
  return $pdo;
}

function start_session(): void {
  if (session_status() !== PHP_SESSION_ACTIVE) {
    session_set_cookie_params(['httponly' => true, 'samesite' => 'Lax', 'secure' => !empty($_SERVER['HTTPS'])]);
    session_start();
  }
}

function csrf_token(): string {
  start_session();
  if (empty($_SESSION['csrf'])) $_SESSION['csrf'] = bin2hex(random_bytes(16));
  return $_SESSION['csrf'];
}

function csrf_check(): void {
  start_session();
  $ok = isset($_POST['csrf'], $_SESSION['csrf']) && hash_equals($_SESSION['csrf'], (string) $_POST['csrf']);
  if (!$ok) { http_response_code(419); exit('CSRF'); }
}

function current_user(): ?array {
  start_session();
  if (empty($_SESSION['uid'])) return null;
  $st = db()->prepare('SELECT id, email, name FROM users WHERE id = ?');
  $st->execute([$_SESSION['uid']]);
  return $st->fetch() ?: null;
}

function login_user(int $id): void {
  start_session();
  session_regenerate_id(true);
  $_SESSION['uid'] = $id;
}
`;
      const login = `<?php
declare(strict_types=1);
require __DIR__ . '/auth.php';
start_session();
$error = '';
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
  csrf_check();
  $email = strtolower(trim((string) ($_POST['email'] ?? '')));
  $password = (string) ($_POST['password'] ?? '');
  $st = db()->prepare('SELECT id, password_hash FROM users WHERE email = ?');
  $st->execute([$email]);
  $user = $st->fetch();
  if ($user && password_verify($password, $user['password_hash'])) {
    login_user((int) $user['id']);
    header('Location: /dashboard.php');
    exit;
  }
  $error = 'Zlý email alebo heslo';
}
$token = csrf_token();
?>
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prihlásenie · ${c.name}</title>
  <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
  <main class="card">
    <h1>${c.name}</h1>
    <p>PHP session brána</p>
    ${c.google ? '<a class="btn" href="/oauth.php?provider=google">Pokračovať cez Google</a>' : ''}
    ${c.github ? '<a class="btn" href="/oauth.php?provider=github">Pokračovať cez GitHub</a>' : ''}
    ${c.email ? `<form method="post" class="stack">
      <input type="hidden" name="csrf" value="<?= htmlspecialchars($token) ?>">
      <label>Email <input name="email" type="email" required></label>
      <label>Heslo <input name="password" type="password" minlength="8" required></label>
      <?php if ($error): ?><p class="err"><?= htmlspecialchars($error) ?></p><?php endif; ?>
      <button class="btn primary">Prihlásiť sa</button>
    </form>
    <a class="link" href="/register.php">Registrácia</a>` : ''}
  </main>
</body>
</html>
`;
      const register = `<?php
declare(strict_types=1);
require __DIR__ . '/auth.php';
start_session();
$error = '';
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
  csrf_check();
  $email = strtolower(trim((string) ($_POST['email'] ?? '')));
  $name = trim((string) ($_POST['name'] ?? ''));
  $password = (string) ($_POST['password'] ?? '');
  if (!filter_var($email, FILTER_VALIDATE_EMAIL) || strlen($password) < 8) {
    $error = 'Email alebo heslo je slabé';
  } else {
    $hash = password_hash($password, PASSWORD_DEFAULT);
    try {
      $st = db()->prepare('INSERT INTO users (email, name, password_hash) VALUES (?, ?, ?)');
      $st->execute([$email, $name, $hash]);
      login_user((int) db()->lastInsertId());
      header('Location: /dashboard.php');
      exit;
    } catch (Throwable $e) {
      $error = 'Účet už existuje';
    }
  }
}
$token = csrf_token();
?>
<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8"><title>Registrácia</title><link rel="stylesheet" href="/assets/auth.css"></head>
<body><main class="card"><h1>Nový účet</h1>
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="<?= htmlspecialchars($token) ?>">
  <label>Meno <input name="name" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Heslo <input name="password" type="password" minlength="8" required></label>
  <?php if ($error): ?><p class="err"><?= htmlspecialchars($error) ?></p><?php endif; ?>
  <button class="btn primary">Vytvoriť účet</button>
</form></main></body></html>
`;
      const dash = `<?php
declare(strict_types=1);
require __DIR__ . '/auth.php';
$user = current_user();
if (!$user) { header('Location: /login.php'); exit; }
?>
<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8"><title>Dashboard</title><link rel="stylesheet" href="/assets/auth.css"></head>
<body><main class="card"><h1>Ahoj <?= htmlspecialchars($user['name'] ?: $user['email']) ?></h1>
<p>Session je platná.</p><a class="btn" href="/logout.php">Odhlásiť</a></main></body></html>
`;
      const logout = `<?php
declare(strict_types=1);
require __DIR__ . '/auth.php';
start_session();
$_SESSION = [];
session_destroy();
header('Location: /login.php');
`;
      const sql = `CREATE TABLE users (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  email TEXT NOT NULL UNIQUE,
  name TEXT NOT NULL DEFAULT '',
  password_hash TEXT,
  created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
);
`;
      const css = `body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1A1814;color:#F3EEE4;font-family:system-ui,sans-serif}
.card{width:min(380px,92vw);background:#0F0E0C;border:1px solid rgba(200,161,110,.22);border-radius:18px;padding:28px}
.stack{display:grid;gap:10px} label{display:grid;gap:6px;font-size:12px;color:#9A9286}
input,.btn{width:100%;padding:11px;border-radius:12px;border:1px solid rgba(200,161,110,.3);background:#161411;color:#F3EEE4}
.primary{background:#C8A16E;color:#1A1814;border:0;font-weight:700}
.err{color:#E07A6A} .link{color:#C8A16E}
`;
      return [
        { path: "config.php", content: config, lang: "php" },
        { path: "auth.php", content: auth, lang: "php" },
        { path: "login.php", content: login, lang: "php" },
        { path: "register.php", content: register, lang: "php" },
        { path: "dashboard.php", content: dash, lang: "php" },
        { path: "logout.php", content: logout, lang: "php" },
        { path: "schema.sql", content: sql, lang: "sql" },
        { path: "assets/auth.css", content: css, lang: "css" },
        { path: "preview/login.html", content: loginPreviewHtml(c), lang: "html", preview: true },
      ];
    }

    function generate() {
      const c = cfg();
      if (!c.email && !c.google && !c.github) return toast("Zapni aspoň jeden provider");
      state.files = state.stack === "php" ? phpFiles(c) : nextFiles(c);
      const previewIdx = state.files.findIndex((f) => f.preview);
      state.active = previewIdx >= 0 ? previewIdx : 0;
      render();
      toast(state.stack === "php" ? "HTML/PHP brána hotová" : "Next.js brána hotová");
    }

    function render() {
      const tabs = $("tabs");
      tabs.innerHTML = "";
      state.files.forEach((f, i) => {
        const b = document.createElement("button");
        b.className = "tab" + (i === state.active ? " on" : "");
        b.textContent = f.path.split("/").pop();
        b.onclick = () => { state.active = i; render(); };
        tabs.appendChild(b);
      });
      const file = state.files[state.active];
      const lines = (file?.content || "").split("\n");
      $("gutter").textContent = lines.map((_, i) => i + 1).join("\n");
      $("code").textContent = file?.content || "";
      const frame = $("preview");
      const previewFile = state.files.find((f) => f.preview);
      if (state.mode === "preview" && previewFile) {
        $("codeWrap").hidden = true;
        frame.hidden = false;
        frame.srcdoc = previewFile.content;
      } else {
        $("codeWrap").hidden = false;
        frame.hidden = true;
      }
    }

    function setStack(stack) {
      state.stack = stack;
      $("stackNext").classList.toggle("on", stack === "next");
      $("stackPhp").classList.toggle("on", stack === "php");
      generate();
    }
    function setMode(mode) {
      state.mode = mode;
      $("modeCode").classList.toggle("on", mode === "code");
      $("modePreview").classList.toggle("on", mode === "preview");
      render();
    }

    async function copyActive() {
      const file = state.files[state.active];
      if (!file) return;
      await navigator.clipboard.writeText(file.content);
      toast("Skopírované: " + file.path);
    }
    async function downloadZip() {
      if (!state.files.length) generate();
      const zip = new JSZip();
      const root = zip.folder("auth-gateway");
      state.files.forEach((f) => root.file(f.path, f.content));
      const blob = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = cfg().name + "-" + state.stack + "-auth.zip";
      a.click();
    }

    $("stackNext").onclick = () => setStack("next");
    $("stackPhp").onclick = () => setStack("php");
    $("modeCode").onclick = () => setMode("code");
    $("modePreview").onclick = () => setMode("preview");
    $("genBtn").onclick = generate;
    $("copyBtn").onclick = copyActive;
    $("zipBtn").onclick = downloadZip;
    ["projectName", "db", "pEmail", "pGoogle", "pGithub"].forEach((id) => $(id).addEventListener("change", generate));
    generate();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
